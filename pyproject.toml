[project]
name = "repo-scaffold-desktop"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "jinja2>=3.1.6",
    "python-dotenv>=1.2.2",
    "keyring>=24.0",
    "rich>=15.0.0",
]

[project.scripts]
scaffold = "app.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Long string literals are intentional in batch-generation scripts that
# define ticket manifest content as data — splitting them would hurt readability.
"scripts/generate_overnight_manifests.py" = ["E501"]
# Spike scripts have long format strings for human-readable table output.
"scripts/spikes/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# WOR-464: -n 8 enables pytest-xdist (parallel test workers). On the 16C/32T
# 9950X3D dev box, full suite drops from ~125s serial to ~34s. Operator can
# override with -p no:xdist for serial. PostToolUse single-file pytest hook
# disables xdist explicitly since worker-spawn overhead would dominate.
#
# WOR-468: coverage flags moved out of addopts to CI workflow. Local dev
# pytest is now ~20s faster (no coverage instrumentation overhead). Pass
# --cov=app explicitly when you want coverage locally:
#   pytest --cov=app --cov-report=term-missing --cov-fail-under=80
addopts = "-n 8"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.deptry]
known_first_party = ["app"]

[tool.deptry.package_module_name_map]
"python-dotenv" = ["dotenv"]
"pyyaml" = ["yaml"]

[tool.deptry.per_rule_ignores]
# `yaml` is in requirements-dev.txt (used by scripts/generate_overnight_manifests.py).
# deptry classifies scripts/ as production code and complains it's transitive.
# Keeping pyyaml as a dev-only dep is the right call (operators don't need it at runtime).
DEP003 = ["yaml"]

[tool.bandit]
targets = ["app"]
exclude_dirs = ["tests"]
skips = []

[tool.coverage.run]
# __main__.py is pure entry-point shim ("sys.exit(main())") — only runs
# under `python -m app.cli`, never during pytest. Including it skews the
# SonarCloud Risk-view chart with a 0% datapoint that stretches the
# Coverage y-axis (rest of the codebase is ~80% covered). Omit it.
omit = [
    "*/__main__.py",
]
