# YAML schema for wor313.yaml:
# ---
# common_forbidden : list[str]     -- paths forbidden for ALL tickets (e.g. .env, .mcp.json)
# epic_branch      : str           -- default base_branch for all generated manifests
# tickets          : list[Ticket]  -- each entry produces one manifest
#   Ticket:
#     ticket_id          : str     -- unique identifier, e.g. "WOR-247"
#     branch             : str     -- git branch name for the ticket
#     title              : str     -- human-readable title
#     allowed_paths      : list[str] -- glob paths the worker may write to
#     forbidden_paths_extra : list[str] -- additional forbidden paths beyond common_forbidden;
#                                       override the default forbid by listing in allowed_paths
#     related_files_hint : list[str] -- files to read for context
#     effort             : str     -- low | medium | high | xhigh | max
#     change_type        : str     -- additive | modification | refactor | removal | docs
#     reasoning_demand   : int     -- 1-5 scale
#     scope_clarity      : int     -- 1-5 scale
#     constraint_density : int     -- 1-5 scale
#     ac_specificity     : int     -- 1-5 scale
#     tech_stack         : str     -- space-separated tags, e.g. "python,pytest"
#     raw_extensions     : list[str] -- file extensions, e.g. [".py"]
#     objective          : str     -- one-paragraph description
#     acceptance_criteria: list[str] -- bulleted checklist
#     implementation_constraints: list[str] -- rules the worker must follow
# ---

common_forbidden:
  - .env
  - .mcp.json
  - .claude/settings*

epic_branch: epic/wor-313-mega-overnight-hardening

tickets:
  - ticket_id: WOR-247
    branch: wor-247-bench-store-import-contract
    title: 'Import linter: add bench_store isolation contract'
    allowed_paths: [".importlinter"]
    related_files_hint: [.importlinter, app/core/bench_store.py]
    effort: high
    change_type: additive
    reasoning_demand: 2
    scope_clarity: 5
    constraint_density: 3
    ac_specificity: 5
    tech_stack: python,importlinter,toml
    raw_extensions: [".importlinter"]
    objective: >-
      Add a `forbidden` contract to `.importlinter` blocking watcher modules from
      importing app.core.bench_store, then run `lint-imports` to confirm it passes.
    acceptance_criteria:
      - >-
        New `[importlinter:contract:bench-store-not-in-watcher]` contract added to .importlinter
      - >-
        Contract is type=forbidden, source_modules lists all app.core.watcher.* modules,
        forbidden_modules=app.core.bench_store
      - "`lint-imports` passes with the new contract"
      - >-
        Contract has CONTRACT OWNER comment matching existing style
    implementation_constraints:
      - Use Edit tool to modify .importlinter, do not rewrite the whole file
      - >-
        Mirror the comment style of existing contracts (CONTRACT OWNER, type, name)
      - Add the contract block at the END of the file

