    raw_extensions: [".yml", ".md"]
    objective: >-
      Add a CI step that smoke-starts `python -m app.cli watcher` for 5 seconds
      and asserts it stays alive. Catches the class of startup-only daemon bugs
      (PRs #601-#604) that pytest/mypy don't catch.
    acceptance_criteria:
      - >-
        .github/workflows/ci.yml gains a watcher-smoke job that fails the build when
        daemon exits within 5s
      - "Job uses LINEAR_API_KEY=dummy + clean working dir"
      - >-
        Job runs after pytest and on every PR targeting main or epic/*
      - >-
        Local one-liner equivalent documented in CLAUDE.md (e.g. make watcher-smoke
        or bash one-liner)
      - "Cost: ~6 sec per CI run"
    implementation_constraints:
      - >-
        Use `timeout 5 python -m app.cli watcher --no-epic-shutdown || ([ $? -eq 124
        ] && echo OK) || (echo FAIL && exit 1)` pattern
      - "Pre-flight: read .github/workflows/ to see the existing CI structure first"
      - >-
        If a Makefile doesn't exist, you can create one with the smoke target -- or
        document in CLAUDE.md as a bash one-liner
      - "DO NOT run the smoke test locally to verify (requires vLLM); CI will validate"

