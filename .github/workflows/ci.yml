name: CI

on:
  push:
    branches: [main, 'epic/**']
  pull_request:
    branches: [main, 'wor-*', 'epic/**']

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    # WOR-390: PySide6 wraps native Qt and needs system shared libs (libEGL,
    # libxcb-*) at import time. Headless ubuntu-latest doesn't ship them.
    # Setting offscreen tells Qt not to look for an X server.
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history for SonarCloud SCM auto-assignment

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: 'requirements-dev.txt'

      - name: Install system Qt dependencies (WOR-390)
        # PySide6 (loaded by pytest-qt at collection time) dynamically links
        # against libEGL.so.1 and the libxcb-* family. Install the minimal
        # headless Qt6 runtime; the offscreen platform set in `env` above
        # avoids needing an actual X server.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxcb-cursor0

      - name: Install dependencies
        # WOR-69 added pytest-qt to requirements-dev.txt, which loads its
        # plugin at pytest collection time and requires PySide6/PyQt5/PyQt6
        # to be installed. PySide6 lives in requirements-ui.txt, so install
        # both here.
        run: pip install -r requirements-dev.txt -r requirements-ui.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Architecture contracts
        run: lint-imports

      - name: Security scan
        run: bandit -c pyproject.toml -r app/

      - name: Semgrep
        run: semgrep --config auto --error app/
        env:
          PYTHONUTF8: "1"

      - name: Type check
        run: mypy app/

      - name: Dependency check
        run: deptry . --requirements-files requirements.txt,requirements-dev.txt,requirements-ui.txt

      - name: Test
        # WOR-468: coverage flags previously lived in pyproject addopts but
        # made every local pytest ~20s slower. Moved here so CI still gets
        # the gate + SonarCloud XML; local dev defaults to fast (no-cov).
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80 --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

      - name: SonarCloud scan (informational)
        if: github.base_ref != 'main' && github.actor != 'dependabot[bot]'
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v8.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarCloud scan
        if: github.base_ref == 'main' && github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@v8.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  watcher-smoke:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'pull_request' && (github.base_ref == 'main' || startsWith(github.base_ref, 'epic/'))

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: 'requirements-dev.txt'

      - name: Install dependencies
        # WOR-69 added pytest-qt to requirements-dev.txt, which loads its
        # plugin at pytest collection time and requires PySide6/PyQt5/PyQt6
        # to be installed. PySide6 lives in requirements-ui.txt, so install
        # both here.
        run: pip install -r requirements-dev.txt -r requirements-ui.txt

      - name: Watcher smoke test (5s)
        run: |
          timeout 5 python -m app.cli watcher --no-epic-shutdown || \
            ([ $? -eq 124 ] && echo "OK: watcher stayed alive for 5s" || (echo "FAIL: watcher exited early" && exit 1))
        env:
          LINEAR_API_KEY: dummy  # pragma: allowlist secret
