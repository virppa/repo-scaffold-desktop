name: CI

on:
  push:
    branches: [main, 'epic/**']
  pull_request:
    branches: [main, 'wor-*', 'epic/**']

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: 'requirements-dev.txt'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Architecture contracts
        run: lint-imports

      - name: Security scan
        run: bandit -c pyproject.toml -r app/

      - name: Semgrep
        run: semgrep --config auto --error app/
        env:
          PYTHONUTF8: "1"

      - name: Type check
        run: mypy app/

      - name: Dependency check
        run: deptry . --requirements-files requirements.txt,requirements-dev.txt

      - name: Test
        run: pytest --cov=app --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

      - name: SonarCloud scan (informational)
        if: github.base_ref != 'main' && github.actor != 'dependabot[bot]'
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarCloud scan
        if: github.base_ref == 'main' && github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
